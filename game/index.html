<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VITARIA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>VITARIA: ตำนานธาตุแห่งชีวิต</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking the first paint (slow phone connections see the loading screen at once) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="vignette"></div>
      <div id="world-ui"></div>
      <div id="hud"></div>
      <div id="overlay"></div>
      <div id="rotate-hint"><div>📱↻</div><div>หมุนโทรศัพท์เป็นแนวนอนเพื่อเล่น</div></div>
    </div>
    <!-- boot loading screen: drawn before any script runs; src/ui/Loading.ts takes it over -->
    <div id="boot" class="loader">
      <div class="ld-center">
        <div class="ld-logo">VITARIA</div>
        <div class="ld-sub">ตำนานธาตุแห่งชีวิต</div>
        <div class="ld-cell"><i></i><i></i><i></i></div>
        <div class="ld-bar"><div class="ld-fill"></div></div>
        <div class="ld-label"><span class="ld-text">กำลังโหลด…</span><span class="ld-pct">0%</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
